<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sourashtra Calendar</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #fffbf0;
    text-align: center;
    padding: 20px;
  }
  h1 {
    font-size: 32px;
    color: #b5451b;
    margin-bottom: 8px;
  }
  p {
    color: #666;
    margin-bottom: 30px;
  }
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .btn {
    display: inline-block;
    padding: 16px 50px;
    font-size: 20px;
    font-weight: 600;
    color: white;
    background: #d95a1e;
    border-radius: 50px;
    text-decoration: none;
    box-shadow: 0 4px 15px rgba(217, 90, 30, 0.3);
    transition: all 0.2s ease;
    min-width: 300px;
  }
  .btn:hover {
    background: #b5451b;
    transform: translateY(-2px);
  }
  .btn-secondary {
    background: #fff;
    color: #d95a1e;
    border: 2px solid #d95a1e;
    box-shadow: none;
  }
  .btn-secondary:hover {
    background: #fff7f0;
  }
</style>
</head>
<body>

  <h1>🗓️ Sourashtra Calendar</h1>
  <p>Click below to view</p>

  <div class="buttons">
    <a class="btn" href="https://sourashtracalendar.github.io/2027/">2027 Calendar Request Form</a>
    
    <a class="btn btn-secondary" href="https://drive.google.com/file/d/181wgwvFT2NJLHQ9S-GP7QNjA6CMXJY2S/view?pli=1" target="_blank">2026 Calendar Digital Version</a>
  </div>

</body>
</html>
